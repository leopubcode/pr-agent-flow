[project]
name = "pr-agent-consumer"
version = "0.1.0"
description = "SQS consumer that hands pull request Feedback to a per-PR Coordinator run by herdr and sbx-start"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "PyGithub>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
pr-agent-consumer = "consumer.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["consumer*"]
